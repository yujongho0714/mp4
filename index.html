<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#16302b;--mute:#5f7772;--line:#cfdad7;--accent:#0f766e;--accent-ink:#fff;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#17262a;--ink:#e3efec;--mute:#93aaa5;--line:#2a3f3c;--accent:#2dd4bf;--accent-ink:#06201c;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f1a18;--card:#17262a;--ink:#e3efec;--mute:#93aaa5;--line:#2a3f3c;--accent:#2dd4bf;--accent-ink:#06201c;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;line-height:1.3;margin:8px 0 4px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--accent);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;font-weight:500}
.drop input{display:none}
.drop small{display:block;color:var(--mute);font-weight:400;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.stats div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stats dt{font-size:13px;color:var(--mute)}
.stats dd{margin:0;font-size:18px;font-weight:700}
label.f{display:block;font-weight:500;margin:14px 0 6px}
select,input[type=number]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 6px;cursor:pointer;font-size:15px}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
button{font:inherit;font-weight:700;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:16px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
progress{width:100%;height:12px;accent-color:var(--accent)}
.note{font-size:14px;color:var(--mute);margin:10px 0 0}
.warn{color:var(--warn)}
video{width:100%;border-radius:10px;background:#000;max-height:50vh}
a.dl{display:block;text-align:center;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);margin-top:12px}
#stage{position:relative;width:min(100%,calc(55vh*var(--ar,1.78)));aspect-ratio:var(--ar,1.78);margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0}
#ov{touch-action:none;cursor:crosshair}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sm{margin:0;padding:10px 8px;font-weight:500;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.seg .sm{flex:1}.chip{width:auto;padding:8px 12px}
[hidden]{display:none!important}
</style>

<body>
<main>
<h1>영상 편집기</h1>
<p class="sub">구간 자르기·인물 트래킹·화면 비율·용량 줄이기를 한 번에 해요. 영상은 내 기기 안에서만 처리되고 서버로 올라가지 않아요.</p>

<label class="drop"><input type="file" id="file" accept="video/*">영상 선택하기<small>폰에서 찍은 영상 (mp4, mov 등)</small></label>

<section id="setup" hidden>
<div class="card">
<div id="stage"><video id="pv" playsinline></video><canvas id="ov"></canvas></div>
<input type="range" id="scrub" min="0" max="1000" value="0" aria-label="재생 위치" style="margin-top:10px">
<div class="row"><span id="tNow">0:00</span><span id="tSel"></span></div>
<div class="seg" style="margin-top:8px"><button type="button" id="play" class="sm">▶ 재생</button><button type="button" id="setS" class="sm">여기부터 시작</button><button type="button" id="setE" class="sm">여기까지 끝</button></div>
<label class="f">인물 트래킹</label>
<p class="note" style="margin:0">영상 위에서 사람을 머리부터 발끝까지 감싸도록 드래그해 선택하세요. 여러 명은 같은 장면에서 차례로 선택하면 모두 화면에 담겨요 (최대 4명).</p>
<div id="chips"></div>
<label class="f">화면 비율</label>
<div class="seg" role="radiogroup" aria-label="화면 비율">
<label><input type="radio" name="asp" value="0" checked><span>원본</span></label>
<label><input type="radio" name="asp" value="0.5625"><span>9:16</span></label>
<label><input type="radio" name="asp" value="1"><span>1:1</span></label>
<label><input type="radio" name="asp" value="1.7778"><span>16:9</span></label>
</div>
<p class="note" id="edMsg"></p>
</div>
<div class="card">
<dl class="stats">
<div><dt>원본 용량</dt><dd id="sSize">-</dd></div>
<div><dt>길이</dt><dd id="sDur">-</dd></div>
<div><dt>해상도</dt><dd id="sRes">-</dd></div>
<div><dt>원본 비트레이트</dt><dd id="sBr">-</dd></div>
</dl>
</div>

<div class="card">
<div class="seg" role="radiogroup" aria-label="압축 방식">
<label><input type="radio" name="mode" value="quality" checked><span>화질 우선</span></label>
<label><input type="radio" name="mode" value="size"><span>목표 용량</span></label>
</div>

<div id="qBox">
<label class="f" for="ratio">원본 대비 비트레이트 <b id="ratioVal">50%</b></label>
<input type="range" id="ratio" min="25" max="90" step="5" value="50">
<div class="row"><span>용량 작게</span><span>화질 높게</span></div>
</div>

<div id="sBox" hidden>
<label class="f" for="target">목표 용량 (MB)</label>
<input type="number" id="target" min="1" step="1" value="8" inputmode="numeric">
<div class="seg" style="margin-top:8px">
<button type="button" class="pre" data-v="8" style="margin:0;padding:8px;background:var(--bg);color:var(--ink);font-weight:500">8</button>
<button type="button" class="pre" data-v="25" style="margin:0;padding:8px;background:var(--bg);color:var(--ink);font-weight:500">25</button>
<button type="button" class="pre" data-v="50" style="margin:0;padding:8px;background:var(--bg);color:var(--ink);font-weight:500">50</button>
<button type="button" class="pre" data-v="100" style="margin:0;padding:8px;background:var(--bg);color:var(--ink);font-weight:500">100</button>
</div>
</div>

<label class="f" for="codec">영상 방식</label>
<select id="codec"><option value="avc">H.264 (어디서나 재생, 기본)</option></select>

<label class="f" for="res">해상도</label>
<select id="res">
<option value="0">원본 유지 (화질 최우선)</option>
<option value="1080">최대 1080p</option>
<option value="720">최대 720p</option>
</select>

<p class="note" id="estimate"></p>
<button id="go">내보내기</button>
</div>
</section>

<section id="work" class="card" hidden>
<progress id="bar" value="0" max="1"></progress>
<p class="note" id="status">준비 중…</p>
<p class="note warn">처리 중에는 이 화면을 켜 둔 채로 유지해 주세요. 소리는 다시 압축하지 않고 그대로 가져와요.</p>
</section>

<section id="done" class="card" hidden>
<video id="out" controls playsinline></video>
<dl class="stats" style="margin-top:12px">
<div><dt>압축 후 용량</dt><dd id="oSize">-</dd></div>
<div><dt>줄어든 비율</dt><dd id="oCut">-</dd></div>
</dl>
<p class="note warn" id="oWarn" hidden></p>
<a class="dl" id="dl" download>압축본 저장하기</a>
</section>

<p class="note" id="err" style="color:#dc2626" hidden></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
let src=null,vid=null,meta={};
const fmtMB=b=>(b/1048576).toFixed(b<10485760?2:1)+' MB';
const fmtT=s=>Math.floor(s/60)+'분 '+String(Math.round(s%60)).padStart(2,'0')+'초';
const AUDIO_BR=128000;

function showErr(m){$('err').textContent=m;$('err').hidden=!m}

$('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  showErr(''); ['done','work'].forEach(i=>$(i).hidden=true);
  src=f; if(vid)URL.revokeObjectURL(vid.src);
  vid=document.createElement('video'); vid.preload='metadata'; vid.playsInline=true;
  vid.src=URL.createObjectURL(f);
  vid.onloadedmetadata=()=>{
    meta={dur:vid.duration,w:vid.videoWidth,h:vid.videoHeight,br:f.size*8/vid.duration};
    $('sSize').textContent=fmtMB(f.size); $('sDur').textContent=fmtT(meta.dur);
    $('sRes').textContent=meta.w+'×'+meta.h; $('sBr').textContent=(meta.br/1e6).toFixed(1)+' Mbps';
    $('setup').hidden=false; initEd();
  };
  vid.onerror=()=>showErr('이 영상은 브라우저에서 열 수 없어요. 다른 형식이나 다른 브라우저로 시도해 주세요.');
});

function mode(){return document.querySelector('input[name=mode]:checked').value}
function videoBitrate(){
  if(mode()==='quality') return Math.max(300000,meta.br*$('ratio').value/100-AUDIO_BR*0.5);
  const t=Math.max(1,+$('target').value||1)*1048576*8*0.93;
  return Math.max(200000,t/dur()-AUDIO_BR);
}
function update(){
  $('ratioVal').textContent=$('ratio').value+'%';
  $('qBox').hidden=mode()!=='quality'; $('sBox').hidden=mode()!=='size';
  if(!meta.dur)return;
  const est=(videoBitrate()+AUDIO_BR)*dur()/8;
  const over=est>=src.size*dur()/meta.dur;
  $('estimate').innerHTML='예상 결과 약 <b>'+fmtMB(Math.min(est,src.size))+'</b>'+(over?' <span class="warn">— 원본보다 작아지지 않아요. 설정을 낮춰 주세요.</span>':'');
}
document.querySelectorAll('input[name=mode],#ratio,#target,#res').forEach(el=>el.addEventListener('input',update));
document.querySelectorAll('.pre').forEach(b=>b.onclick=()=>{$('target').value=b.dataset.v;update()});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let tS=0,tE=0,people=[],anchor=0,trk=null,pst={},drag=null,lastT=-1,TW=256,TH=256;
const pv=$('pv'),ov=$('ov'),oc=ov.getContext('2d'),tc=document.createElement('canvas'),tx=tc.getContext('2d',{willReadFrequently:true});
const dur=()=>Math.max(.1,tE-tS),fmtC=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'),note=m=>{$('edMsg').textContent=m};
const aspVal=()=>+document.querySelector('input[name=asp]:checked').value||meta.w/meta.h;
function setTD(w,h){const k=256/Math.max(w,h);TW=Math.round(w*k);TH=Math.round(h*k);tc.width=TW;tc.height=TH}
function gray(d){tx.drawImage(d,0,0,TW,TH);const a=tx.getImageData(0,0,TW,TH).data,g=new Uint8Array(TW*TH);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(a[j]+2*a[j+1]+a[j+2])>>2;return g}
function crop(g,x,y,w,h){const o=new Float32Array(w*h);for(let j=0;j<h;j++)for(let i=0;i<w;i++)o[j*w+i]=g[(y+j)*TW+x+i];return o}
// 선택한 박스를 템플릿으로 저장하고, 프레임마다 주변을 탐색해 가장 비슷한 위치로 따라감
function mk(g){return people.map(p=>{const w=Math.max(8,Math.min(TW,Math.round(p.b[2]*TW))),h=Math.max(8,Math.min(TH,Math.round(p.b[3]*TH))),x=Math.min(TW-w,Math.round(p.b[0]*TW)),y=Math.min(TH-h,Math.round(p.b[1]*TH));return{x,y,w,h,t:crop(g,x,y,w,h)}})}
function step(T,g){for(const o of T){let best=1e18,bx=o.x,by=o.y;for(let u=-16;u<=16;u++){const y=o.y+u;if(y<0||y+o.h>TH)continue;for(let v=-16;v<=16;v++){const x=o.x+v;if(x<0||x+o.w>TW)continue;let s=0;for(let j=0;j<o.h&&s<best;j+=2){const a=(y+j)*TW+x,b=j*o.w;for(let i=0;i<o.w;i+=2)s+=Math.abs(g[a+i]-o.t[b+i])}if(s<best){best=s;bx=x;by=y}}}o.x=bx;o.y=by;const n=crop(g,bx,by,o.w,o.h);for(let k=0;k<n.length;k++)o.t[k]+=(n[k]-o.t[k])*.08}}
const fit=(c,s,lo,hi,W)=>s>=W?W/2:Math.min(Math.max(c,hi-s/2,s/2),lo+s/2,W-s/2);
// 크롭 창: 선택한 모든 인물(+여백)을 반드시 포함하도록 계산. 부드럽게 따라가되 포함 조건은 매 프레임 강제
function cropWin(DW,DH,a,B,st){
  const Fw=a>=DW/DH?DW:DH*a,Cw=Math.max(DW,DH*a);let tw=Fw,cx=DW/2,cy=DH/2,u=null;
  if(B.length){let x1=1e9,y1=1e9,x2=-1,y2=-1;for(const b of B){const mx=b[2]*.08+4,my=b[3]*.06+4;x1=Math.min(x1,b[0]-mx);y1=Math.min(y1,b[1]-my);x2=Math.max(x2,b[0]+b[2]+mx);y2=Math.max(y2,b[1]+b[3]+my)}
    x1=Math.max(0,x1);y1=Math.max(0,y1);x2=Math.min(DW,x2);y2=Math.min(DH,y2);u={x1,y1,x2,y2};
    tw=Math.min(Cw,Math.max(Fw*.5,x2-x1,(y2-y1)*a));cx=(x1+x2)/2;cy=(y1+y2)/2}
  if(st.w===undefined){st.w=tw;st.cx=cx;st.cy=cy}else{st.w+=(tw-st.w)*.12;st.cx+=(cx-st.cx)*.12;st.cy+=(cy-st.cy)*.12}
  let w=st.w;if(u)w=Math.max(w,u.x2-u.x1,(u.y2-u.y1)*a);w=Math.min(w,Cw);const h=w/a;
  const x=fit(st.cx,w,u?u.x1:1e9,u?u.x2:-1e9,DW),y=fit(st.cy,h,u?u.y1:1e9,u?u.y2:-1e9,DH);
  st.w=w;st.cx=x;st.cy=y;return{x:x-w/2,y:y-h/2,w,h}}
function drawWin(c,src,sw,sh,w,Wo,Ho){c.fillStyle='#000';c.fillRect(0,0,Wo,Ho);const sx=Math.max(0,w.x),sy=Math.max(0,w.y),ex=Math.min(sw,w.x+w.w),ey=Math.min(sh,w.y+w.h),k=Wo/w.w;
  c.drawImage(src,sx,sy,ex-sx,ey-sy,(sx-w.x)*k,(sy-w.y)*k,(ex-sx)*k,(ey-sy)*k)}
function initEd(){tS=0;tE=meta.dur;people=[];trk=null;pst={};note('');setTD(meta.w,meta.h);$('stage').style.setProperty('--ar',meta.w/meta.h);pv.src=vid.src;renderChips();selInfo()}
function selInfo(){$('tSel').textContent='구간 '+fmtC(tS)+' ~ '+fmtC(tE)+' ('+Math.round(dur())+'초)';update()}
function renderChips(){$('chips').innerHTML=people.map((p,i)=>'<button type="button" class="sm chip" data-i="'+i+'">인물 '+(i+1)+' ✕</button>').join('')}
$('chips').onclick=e=>{const i=e.target.closest('[data-i]');if(!i)return;people.splice(+i.dataset.i,1);trk=null;pst={};renderChips()};
$('setS').onclick=()=>{tS=Math.min(pv.currentTime,tE-.5);selInfo()};
$('setE').onclick=()=>{tE=Math.min(meta.dur,Math.max(pv.currentTime,tS+.5));selInfo()};
$('scrub').oninput=()=>{pv.currentTime=$('scrub').value/1000*meta.dur};
$('play').onclick=()=>{if(!pv.paused){pv.pause();return}
  if(people.length&&!trk)pv.currentTime=anchor;else if(pv.currentTime>=tE-.1||pv.currentTime<tS)pv.currentTime=tS;pv.play()};
pv.onplay=pv.onpause=()=>{$('play').textContent=pv.paused?'▶ 재생':'⏸ 일시정지'};
pv.onseeked=()=>{trk=null;pst={}};
const pt=e=>{const r=ov.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
ov.onpointerdown=e=>{if(!meta.dur)return;e.preventDefault();pv.pause();
  if(people.length&&Math.abs(pv.currentTime-anchor)>.05){pv.currentTime=anchor;note('처음 선택한 장면으로 이동했어요. 이 장면에서 다음 사람을 선택해 주세요.');return}
  const [x,y]=pt(e);drag={x0:x,y0:y,x1:x,y1:y};ov.setPointerCapture(e.pointerId)};
ov.onpointermove=e=>{if(drag)[drag.x1,drag.y1]=pt(e)};
ov.onpointerup=ov.onpointercancel=()=>{if(!drag)return;const d=drag;drag=null;const x=Math.min(d.x0,d.x1),y=Math.min(d.y0,d.y1),w=Math.abs(d.x1-d.x0),h=Math.abs(d.y1-d.y0);
  if(w<.03||h<.06){note('박스가 너무 작아요. 사람 전체를 감싸도록 드래그해 주세요.');return}
  if(people.length>=4){note('최대 4명까지 선택할 수 있어요.');return}
  if(!people.length)anchor=pv.currentTime;people.push({b:[x,y,w,h]});trk=null;pst={};renderChips();note('인물 '+people.length+' 선택됨. ▶ 재생으로 트래킹을 미리 확인해 보세요.')};
function boxesPx(){return people.map((p,i)=>trk?[trk[i].x/TW*meta.w,trk[i].y/TH*meta.h,trk[i].w/TW*meta.w,trk[i].h/TH*meta.h]:[p.b[0]*meta.w,p.b[1]*meta.h,p.b[2]*meta.w,p.b[3]*meta.h])}
function drawOv(){
  const W=ov.clientWidth,H=ov.clientHeight;if(!W)return;if(ov.width!==W){ov.width=W;ov.height=H}
  oc.clearRect(0,0,W,H);const s=W/meta.w,show=people.length&&(trk||Math.abs(pv.currentTime-anchor)<.3),B=show?boxesPx():[],a=aspVal();
  if(show||Math.abs(a-meta.w/meta.h)>.01){const w=cropWin(meta.w,meta.h,a,B,trk?pst:(pst={}));
    oc.fillStyle='rgba(0,0,0,.5)';oc.beginPath();oc.rect(0,0,W,H);oc.rect(w.x*s,w.y*s,w.w*s,w.h*s);oc.fill('evenodd');
    oc.strokeStyle='#fff';oc.lineWidth=2;oc.strokeRect(w.x*s,w.y*s,w.w*s,w.h*s)}
  oc.lineWidth=2;oc.font='bold 13px sans-serif';
  B.forEach((b,i)=>{oc.strokeStyle=oc.fillStyle='#2dd4bf';oc.strokeRect(b[0]*s,b[1]*s,b[2]*s,b[3]*s);oc.fillText(i+1,b[0]*s+4,b[1]*s+15)});
  if(drag){oc.strokeStyle='#fbbf24';oc.setLineDash([5,4]);oc.strokeRect(Math.min(drag.x0,drag.x1)*W,Math.min(drag.y0,drag.y1)*H,Math.abs(drag.x1-drag.x0)*W,Math.abs(drag.y1-drag.y0)*H);oc.setLineDash([])}}
function tick(){requestAnimationFrame(tick);
  if($('setup').hidden||!meta.dur||$('go').disabled)return;
  const t=pv.currentTime;if(!pv.paused&&t>=tE)pv.pause();
  if(document.activeElement!==$('scrub'))$('scrub').value=t/meta.dur*1000;
  $('tNow').textContent=fmtC(t);
  if(!pv.paused&&people.length&&t!==lastT){const g=gray(pv);if(trk)step(trk,g);else if(Math.abs(t-anchor)<.25)trk=mk(g)}
  lastT=t;drawOv()}
requestAnimationFrame(tick);

(async()=>{
  if(!window.VideoEncoder||!window.VideoDecoder){
    showErr('이 브라우저는 WebCodecs를 지원하지 않아요. 최신 Chrome(안드로이드·PC)이나 Safari 16.4 이상에서 열어 주세요.');
    $('file').disabled=true;return;
  }
  try{
    const r=await VideoEncoder.isConfigSupported({codec:'hvc1.1.6.L153.B0',width:1920,height:1080,bitrate:5e6});
    if(r.supported){const o=document.createElement('option');o.value='hevc';o.textContent='H.265 (같은 화질에 더 작게, 호환성 낮음)';$('codec').appendChild(o)}
  }catch(e){}
})();

async function pickEncoder(kind,W,H,br,fps){
  const list=kind==='hevc'?['hvc1.1.6.L153.B0','hvc1.1.6.L120.B0']:['avc1.640033','avc1.4d0033','avc1.42003e','avc1.640028'];
  for(const codec of list){
    const cfg={codec,width:W,height:H,bitrate:Math.round(br),framerate:Math.round(fps),latencyMode:'quality',bitrateMode:'variable'};
    try{const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported)return cfg}catch(e){}
  }
  throw new Error('이 해상도의 '+(kind==='hevc'?'H.265':'H.264')+' 인코딩을 지원하지 않아요. 해상도를 낮춰 보세요.');
}

function boxDesc(mp4,track){
  const DS=MP4Box.DataStream||window.DataStream;
  const trak=mp4.getTrackById(track.id);
  for(const e of trak.mdia.minf.stbl.stsd.entries){
    const b=e.avcC||e.hvcC||e.vpcC||e.av1C;
    if(b){const s=new DS(undefined,0,DS.BIG_ENDIAN);b.write(s);return new Uint8Array(s.buffer,8)}
  }
}
function audioAsc(mp4,track){
  const e=mp4.getTrackById(track.id).mdia.minf.stbl.stsd.entries[0];
  const d=e.esds&&e.esds.esd&&e.esds.esd.descs[0]&&e.esds.esd.descs[0].descs[0];
  return d?new Uint8Array(d.data):null;
}

$('go').onclick=async()=>{
  showErr('');
  $('go').disabled=true;$('work').hidden=false;$('done').hidden=true;$('bar').value=0;$('status').textContent='시작하는 중…';
  const t0=performance.now();
  const mp4=MP4Box.createFile();
  const vq=[],aq=[];
  let vt,at,info=null,dec,enc,muxer,cv,cx,W2,H2,useAudio=false,ascMeta=null,firstAudio=true,fail=null,n=0,gop=60,T=null,rot=0,W,H,DW,DH,dsp,dx,past=false,A=0;

  mp4.onError=e=>{fail=new Error('영상 파일을 읽지 못했어요.')};
  mp4.onReady=i=>{
    info=i;vt=i.videoTracks[0];at=i.audioTracks[0];
    if(!vt)return;
    mp4.setExtractionOptions(vt.id,null,{nbSamples:150});
    if(at)mp4.setExtractionOptions(at.id,null,{nbSamples:300});
    mp4.start();
  };
  mp4.onSamples=(id,u,s)=>{(vt&&id===vt.id?vq:aq).push(...s)};

  async function setup(){
    if(!vt)throw new Error('영상 트랙을 찾지 못했어요.');
    W=vt.video.width;H=vt.video.height;
    const m=vt.matrix||[65536,0];
    rot=((Math.round(Math.atan2(m[1],m[0])*180/Math.PI/90)*90)%360+360)%360;
    DW=rot%180?H:W;DH=rot%180?W:H;A=aspVal();
    const fw=A>=DW/DH?DW:DH*A;W2=fw;H2=fw/A;
    const lim=+$('res').value;
    if(lim&&Math.min(W2,H2)>lim){const k=lim/Math.min(W2,H2);W2*=k;H2*=k}
    W2=Math.round(W2);H2=Math.round(H2);W2-=W2%2;H2-=H2%2;
    setTD(DW,DH);dsp=new OffscreenCanvas(DW,DH);dx=dsp.getContext('2d');
    const fps=vt.nb_samples/(vt.duration/vt.timescale);gop=Math.round(fps*2);
    const dcfg={codec:vt.codec,codedWidth:W,codedHeight:H,description:boxDesc(mp4,vt)};
    const sup=await VideoDecoder.isConfigSupported(dcfg);
    if(!sup.supported)throw new Error('이 영상 코덱('+vt.codec+')은 브라우저에서 읽을 수 없어요.');
    const kind=$('codec').value;
    const ecfg=await pickEncoder(kind,W2,H2,videoBitrate(),fps);
    const opts={target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:kind==='hevc'?'hevc':'avc',width:W2,height:H2,rotation:0},fastStart:'in-memory',firstTimestampBehavior:'offset'};
    const asc=at&&at.codec.startsWith('mp4a')?audioAsc(mp4,at):null;
    if(asc){
      useAudio=true;
      opts.audio={codec:'aac',numberOfChannels:at.audio.channel_count,sampleRate:at.audio.sample_rate};
      ascMeta={decoderConfig:{codec:'mp4a.40.2',numberOfChannels:at.audio.channel_count,sampleRate:at.audio.sample_rate,description:asc}};
    }
    muxer=new Mp4Muxer.Muxer(opts);
    enc=new VideoEncoder({output:(c,md)=>muxer.addVideoChunk(c,md),error:e=>{fail=e}});
    enc.configure(ecfg);
    cv=new OffscreenCanvas(W2,H2);cx=cv.getContext('2d');const st={};
    dec=new VideoDecoder({
      output:fr=>{
        const ts=fr.timestamp/1e6,on=people.length>0;
        if(ts>tE||(ts<tS-.001&&!(on&&ts>=anchor-.02))){fr.close();return}
        dx.setTransform(1,0,0,1,0,0);
        if(rot===90){dx.translate(DW,0);dx.rotate(Math.PI/2)}else if(rot===180){dx.translate(DW,DH);dx.rotate(Math.PI)}else if(rot===270){dx.translate(0,DH);dx.rotate(-Math.PI/2)}
        dx.drawImage(fr,0,0,W,H);const fd=fr.duration;fr.close();
        if(on){const g=gray(dsp);if(T)step(T,g);else if(ts>=anchor-.02)T=mk(g)}
        if(ts<tS-.001)return;
        const B=!on?[]:T?T.map(o=>[o.x/TW*DW,o.y/TH*DH,o.w/TW*DW,o.h/TH*DH]):people.map(p=>[p.b[0]*DW,p.b[1]*DH,p.b[2]*DW,p.b[3]*DH]);
        drawWin(cx,dsp,DW,DH,cropWin(DW,DH,A,B,st),W2,H2);
        const f=new VideoFrame(cv,{timestamp:Math.round((ts-tS)*1e6),duration:fd||undefined});
        enc.encode(f,{keyFrame:n++%gop===0});f.close();
        const p=Math.min(1,(ts-tS)/dur());
        $('bar').value=p;$('status').textContent=(on?'트래킹하며 ':'')+'내보내는 중… '+Math.round(p*100)+'%';
      },
      error:e=>{fail=e}
    });
    dec.configure(dcfg);
  }

  async function drain(){
    while(vq.length){
      if(fail)throw fail;
      while(dec.decodeQueueSize>20||enc.encodeQueueSize>20){await sleep(4);if(fail)throw fail}
      const s=vq.shift();
      if(s.cts/s.timescale>tE+1){past=true;mp4.releaseUsedSamples(vt.id,s.number+1);continue}
      dec.decode(new EncodedVideoChunk({type:s.is_sync?'key':'delta',timestamp:Math.round(s.cts*1e6/s.timescale),duration:Math.round(s.duration*1e6/s.timescale),data:s.data}));
      mp4.releaseUsedSamples(vt.id,s.number+1);
    }
    while(aq.length){
      const s=aq.shift();
      const t0=s.cts/s.timescale;
      if(useAudio&&t0>=tS-.001&&t0<tE){
        muxer.addAudioChunkRaw(s.data,s.is_sync?'key':'delta',Math.round(Math.max(0,t0-tS)*1e6),Math.round(s.duration*1e6/s.timescale),firstAudio?ascMeta:undefined);
        firstAudio=false;
      }
      mp4.releaseUsedSamples(at.id,s.number+1);
    }
  }

  try{
    const CH=8*1024*1024;let pos=0,ready=false,guard=0;
    while(pos<src.size&&!past&&guard++<100000){
      const buf=await src.slice(pos,pos+CH).arrayBuffer();buf.fileStart=pos;
      const next=mp4.appendBuffer(buf);
      pos=typeof next==='number'&&next>0?next:pos+buf.byteLength;
      if(info&&!ready){await setup();ready=true}
      if(ready)await drain();
    }
    if(!ready)throw new Error('영상 정보를 읽지 못했어요. mp4·mov 파일인지 확인해 주세요.');
    mp4.flush();await drain();
    $('status').textContent='마무리하는 중…';
    await dec.flush();await enc.flush();
    if(fail)throw fail;
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    $('out').src=url;$('oSize').textContent=fmtMB(blob.size);
    const cut=Math.round((1-blob.size/src.size)*100);
    $('oCut').textContent=cut>0?cut+'% 감소 · '+Math.round((performance.now()-t0)/1000)+'초 걸림':'감소 없음';
    $('oWarn').hidden=cut>0;
    if(cut<=0)$('oWarn').textContent='원본보다 작아지지 않았어요. 비트레이트나 해상도를 더 낮춰서 다시 시도해 주세요.';
    else if(at&&!useAudio){$('oWarn').hidden=false;$('oWarn').textContent='이 영상의 소리 형식은 지원하지 않아 소리 없이 저장됐어요.'}
    $('dl').href=url;$('dl').download=src.name.replace(/\.[^.]+$/,'')+'_edited.mp4';
    $('work').hidden=true;$('done').hidden=false;
    $('done').scrollIntoView({behavior:'smooth'});
  }catch(e){
    showErr('압축 실패: '+(e.message||e));$('work').hidden=true;
    try{dec&&dec.close();enc&&enc.close()}catch(_){}
  }
  $('go').disabled=false;
};
</script>
